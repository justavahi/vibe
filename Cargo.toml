[package]
name = "vibe"
version = "0.1.0"
edition = "2024"

[dependencies]
openrouter = { path = "vendor/openrouter" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dialoguer = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
